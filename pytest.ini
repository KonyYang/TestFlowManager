[pytest]
# Pytest配置文件

# 测试路径
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 最小Python版本
minversion = 3.12

# 添加详细输出
addopts = 
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider

# 标记测试类型
markers =
    unit: 单元测试
    integration: 集成测试
    smoke: 冒烟测试（高风险业务流程）
    gui: GUI测试（需要显示）
    slow: 慢速测试
    skip_in_ci: CI环境中跳过

# Qt测试配置
qt_api = pyqt5

# 测试超时（秒）
faulthandler_timeout = 30

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
