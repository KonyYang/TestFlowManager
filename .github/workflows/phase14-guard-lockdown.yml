name: Phase 14 Guard Lockdown

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  guard-lockdown:
    name: Guard Lockdown Regression
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Phase 14 guard suite
        shell: pwsh
        run: tools/run_phase14_guard_regression.ps1
